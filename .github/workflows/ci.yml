name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-lint-test-build:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: projectflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d projectflow_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Validate Prisma schema
        working-directory: ./backend
        run: ./node_modules/.bin/prisma validate

      - name: Check generated Prisma client
        working-directory: ./backend
        run: ./node_modules/.bin/prisma generate && git diff --exit-code -- prisma/generated

      - name: Audit production dependencies
        working-directory: ./backend
        run: npm audit --omit=dev --audit-level=critical

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: ./node_modules/.bin/prisma generate

      - name: Run Eslint
        working-directory: ./backend
        run: npm run lint

      - name: Check formatting
        working-directory: ./backend
        run: npm run format:check

      - name: Run Backend Tests
        working-directory: ./backend
        run: npm run test -- --passWithNoTests

      - name: Build Backend
        working-directory: ./backend
        run: npm run build

  frontend-lint-test-build:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Eslint
        working-directory: ./frontend
        run: npm run lint

      - name: Check formatting
        working-directory: ./frontend
        run: npm run format:check

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm run test run

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Audit production dependencies
        working-directory: ./frontend
        run: npm audit --omit=dev --audit-level=critical
