name: Feature request
description: Propose an improvement to ProjectFlow
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: scope
    attributes:
      label: Suggested scope
      options:
        - Open-source core
        - Potential commercial extension
        - Hosted operations
        - Unsure
    validations:
      required: true
